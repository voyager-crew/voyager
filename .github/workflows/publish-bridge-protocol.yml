name: Publish Bridge Protocol

# The Local Bridge wire format, shared with voyager-cli. Raising the version in
# packages/bridge-protocol/package.json on main stages it on npm; extension
# releases do not. npm Trusted Publishing authenticates this workflow file
# through OIDC and may only stage: a maintainer approves the staged version with
# their second factor (npmjs.com → Staged Packages, or `npm stage approve`)
# before it goes live. The very first version was published by hand, since npm
# only trusts a workflow for a package that already exists.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/bridge-protocol/**'
      - '.github/workflows/publish-bridge-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-bridge-protocol
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check npm for this version
        id: npm
        run: |
          VERSION=$(node -p "require('./packages/bridge-protocol/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if OUTPUT=$(npm view "@voyager-crew/bridge-protocol@${VERSION}" version 2>&1); then
            echo "@voyager-crew/bridge-protocol@${VERSION} is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "${OUTPUT}" | grep -q 'E404'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A registry or network error is not "missing": fail instead of re-publishing.
            echo "${OUTPUT}" >&2
            exit 1
          fi

      # Trusted Publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Setup Node
        if: steps.npm.outputs.publish == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        if: steps.npm.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Test the protocol
        if: steps.npm.outputs.publish == 'true'
        run: bun run test packages/bridge-protocol

      # Staged publishing needs npm 11.15.0 or later.
      - name: Stage for approval
        if: steps.npm.outputs.publish == 'true'
        working-directory: packages/bridge-protocol
        run: |
          npm install -g npm@^11.15.0
          npm stage publish --access public
