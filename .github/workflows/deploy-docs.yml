name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - '.github/workflows/deploy-docs.yml'
      - 'scripts/update-readme-badges.mjs'
      - 'scripts/build-plugin-catalog.ts'
      - 'scripts/lib/catalogRevision.ts'
      - 'scripts/lib/buildPluginCatalog.ts'
      - 'scripts/lib/buildGeminiSelectorFixes.ts'
      - 'src/core/gemini/selectors/**'
      - 'src/features/plugins/catalog/**'
      - 'src/features/plugins/sites/**'
      # The guide's plugin table lists the builtins and marks the default-on ones.
      - 'src/features/plugins/builtin/**'
      - 'src/features/plugins/storage/pluginDefaults.ts'
      # The changelog pages are built from the in-product release notes.
      - 'src/pages/content/changelog/notes/**'
      - 'src/pages/content/changelog/noteSections.ts'
      - 'src/core/icons/platformLogos.ts'
      - 'package.json'
      # A new create-voyager-plugin version is published before the docs that point at it.
      - 'packages/create-voyager-plugin/**'
      - 'package-lock.json'
      - 'bun.lock'
      - 'CNAME'
  # A release bumps package.json with the workflow's own token, which starts no
  # push run; this puts the new version on the changelog pages right away.
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The docs and the public write-voyager-plugin skill tell users to run
  # `npx create-voyager-plugin@latest`, so a version bump reaches npm before the
  # docs deploy. npm Trusted Publishing authenticates this workflow file through
  # OIDC: no token or 2FA prompt, and npm attaches provenance.
  publish-cli:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check npm for this version
        id: npm
        run: |
          VERSION=$(node -p "require('./packages/create-voyager-plugin/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if OUTPUT=$(npm view "create-voyager-plugin@${VERSION}" version 2>&1); then
            echo "create-voyager-plugin@${VERSION} is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "${OUTPUT}" | grep -q 'E404'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A registry or network error is not "missing": fail instead of re-publishing.
            echo "${OUTPUT}" >&2
            exit 1
          fi

      # Trusted Publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        if: steps.npm.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build and publish create-voyager-plugin
        if: steps.npm.outputs.publish == 'true'
        run: |
          bun run cli:build
          cd packages/create-voyager-plugin
          npm publish --access public

      # Runs on every deploy, not only after a publish: a re-run after a failed check
      # finds the version already on npm and must still prove `latest` works.
      # npm shows a staging placeholder for a minute or two after an upload.
      - name: Wait for npm and smoke-test
        env:
          VERSION: ${{ steps.npm.outputs.version }}
        run: |
          for _ in $(seq 1 40); do
            if [ "$(npm view create-voyager-plugin version 2>/dev/null)" = "${VERSION}" ]; then break; fi
            sleep 15
          done
          test "$(npm view create-voyager-plugin version)" = "${VERSION}"
          cd "$(mktemp -d)"
          npx -y "create-voyager-plugin@${VERSION}" init my-plugin --site claude
          npx -y "create-voyager-plugin@${VERSION}" check my-plugin

  build:
    if: github.ref == 'refs/heads/main'
    needs: publish-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate README badges
        run: node scripts/update-readme-badges.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Writes plugin host files plus the separate Gemini selector-only files.
      # VitePress copies docs/public/ to the dist root under /catalog/.
      - name: Build plugin catalog
        run: bun run catalog:build

      - name: Build docs
        run: bun run docs:build

      - name: Copy CNAME to dist
        run: cp CNAME docs/.vitepress/dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
