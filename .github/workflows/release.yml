name: Release
run-name: >
  ${{
    (github.event_name == 'workflow_dispatch' && inputs.dry_run && format('Release dry run {0}', github.ref_name)) ||
    (github.event_name == 'workflow_dispatch' && inputs.publish_firefox_only && inputs.version && format('Firefox hotfix {0}', inputs.version)) ||
    (github.event_name == 'workflow_dispatch' && inputs.version && format('chore(release): v{0}', inputs.version)) ||
    (github.event_name == 'workflow_dispatch' && !inputs.version && 'chore(release): auto-increment') ||
    (startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name)) ||
    format('Release #{0}', github.run_number)
  }}

# 🚀 Release Workflow Guide
# -------------------------
# This workflow supports two modes of operation:
#
# 1. Manual Release (Only for an Already-Prepared Release)
#    - How: Go to "Actions" -> "Release" -> "Run workflow".
#    - Input: Optional "Version" (e.g., 1.2.0). If left empty, it auto-increments the patch version.
#    - Requirement: The target version's 10-locale in-product changelog must already be committed.
#      This workflow can bump and tag, but it does not author changelog content.
#    - What it does:
#      1. Calculates the next version.
#      2. Bumps the web manifests and Xcode app/extension versions together.
#      3. Commits "chore(release): vX.Y.Z".
#      4. Creates git tag "vX.Y.Z".
#      5. Pushes commit & tag to main.
#      6. Builds artifacts and creates a GitHub Release.
#
# 2. Tag-based Release (Manual Tagging)
#    - How: run `git commit -m "..." && git tag v1.2.0 && git push origin v1.2.0` locally.
#    - What it does:
#      1. Detects the pushed tag (v1.2.0).
#      2. SKIPS version calculation and bumping (assumes you already did it).
#      3. Builds artifacts from that tag.
#      4. Creates a GitHub Release for that tag.
#
# 3. Dry run
#    - How: "Run workflow" with "dry_run" ticked, from main or any branch.
#    - What it does: builds, signs and notarizes every package from that commit
#      under the current package.json version, then stops. No bump, no tag, no
#      GitHub Release, no store submission.
#
# Each stage lives in its own reusable workflow: release-safari.yml,
# release-publish.yml, release-firefox-hotfix.yml, release-chrome-retry.yml and
# release-edge-retry.yml. Job names match the ones these files used to share.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.8) - leave empty to auto-increment patch version'
        required: false
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      publish_only:
        description: 'Only re-publish an existing release to the Chrome Web Store (no bump/build). Requires version.'
        required: false
        type: boolean
        default: false
      publish_edge_only:
        description: 'Only publish an existing release package to Microsoft Edge Add-ons (no bump/build). Requires version.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build, sign and notarize every package from this commit, then stop (no tag, release or store submission).'
        required: false
        type: boolean
        default: false
      publish_firefox_only:
        description: 'Build and publish a Firefox-only four-part hotfix from main (for example 1.6.0.1). Requires version.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.12'

jobs:
  bump-version:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      !inputs.dry_run &&
      !inputs.publish_only &&
      !inputs.publish_edge_only &&
      !inputs.publish_firefox_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.next_version.outputs.version }}
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Calculate next version
        id: next_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            NEXT="$REQUESTED_VERSION"
            echo "Using manual version: $NEXT"
          else
            CURRENT=$(node -e "console.log(require('./package.json').version)")
            echo "Current version: ${CURRENT}"
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            
            # Simple carry logic
            if [ $PATCH -ge 10 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            fi
            if [ $MINOR -ge 10 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            fi
            
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
            echo "Auto-calculated next version: ${NEXT}"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: $NEXT" >&2
            exit 64
          fi

          printf 'version=%s\n' "$NEXT" >> "$GITHUB_OUTPUT"

      - name: Compute tag name
        id: tag
        env:
          VERSION: ${{ steps.next_version.outputs.version }}
        run: printf 'name=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update files, commit and push
        env:
          VERSION: ${{ steps.next_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Bumping to version ${VERSION}"

          bun scripts/bump-version.js "${VERSION}" --no-format
          bun run plugin:release:check

          if [ ! -f "src/pages/content/changelog/notes/${VERSION}.md" ]; then
            echo "Missing 10-locale changelog: src/pages/content/changelog/notes/${VERSION}.md" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json manifest.json manifest.dev.json \
            packages/create-voyager-plugin/package.json \
            "Voyager/Voyager.xcodeproj/project.pbxproj"
          git diff --name-only -z -- src/features/plugins/constants.ts \
            ':(glob)src/features/plugins/verbs/**/*.ts' \
            ':(glob)src/features/plugins/verbs/*/paramsBaseline.json' \
            ':(glob)src/features/plugins/catalog/**/plugin.json' | \
            xargs -0 --no-run-if-empty git add --
          if git diff --cached --quiet; then
            echo "Version files already match v${VERSION}"
          else
            git commit -m "chore(release): v${VERSION}"
          fi

          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Existing ${TAG} does not point at HEAD" >&2
              exit 1
            fi
          else
            git tag "$TAG"
          fi

          # Push commit and tag
          git push origin HEAD:main
          git push origin "$TAG"

  # Job 2: Settle the tag and the commit every build job uses.
  release-tag:
    needs: bump-version
    if: >-
      always() &&
      (github.event_name == 'push' || needs.bump-version.result == 'success' || inputs.dry_run) &&
      !(github.event_name == 'workflow_dispatch' && (inputs.publish_only || inputs.publish_edge_only || inputs.publish_firefox_only))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      ref: ${{ steps.vars.outputs.ref }}
    steps:
      - name: Checkout
        if: ${{ inputs.dry_run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release tag and ref
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_TAG: ${{ needs.bump-version.outputs.tag_name }}
          PUSH_TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            TAG="v$(node -p "require('./package.json').version")"
            REF="$SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
            REF="$TAG"
          else
            TAG="$PUSH_TAG"
            REF="$TAG"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 64
          fi

          printf 'tag=%s\nref=%s\n' "$TAG" "$REF" >> "$GITHUB_OUTPUT"

  # Job 3: Build, sign and notarize the Safari direct-distribution app.
  build-safari-release:
    needs: release-tag
    if: ${{ always() && needs.release-tag.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-safari.yml
    with:
      tag: ${{ needs.release-tag.outputs.tag }}
      ref: ${{ needs.release-tag.outputs.ref }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit

  # Job 4: Build & Release (Runs on both manual and tag push)
  build-and-release:
    needs: [release-tag, build-safari-release]
    if: ${{ always() && needs.build-safari-release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.release-tag.outputs.tag }}
      ref: ${{ needs.release-tag.outputs.ref }}
      notes: ${{ inputs.notes }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit

  # Job 5: Build and publish a Firefox-only four-part hotfix from main.
  publish-firefox-hotfix:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_firefox_only &&
      !inputs.publish_only &&
      !inputs.dry_run &&
      !inputs.publish_edge_only &&
      inputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-firefox-hotfix.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  # Job 6: Re-publish Chrome only — recover a failed Chrome Web Store upload.
  republish-chrome:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_only &&
      !inputs.publish_firefox_only &&
      !inputs.dry_run &&
      inputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-chrome-retry.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  # Job 7: Publish Edge only — recover or retry a Microsoft Edge Add-ons submission.
  republish-edge:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_edge_only &&
      !inputs.publish_firefox_only &&
      !inputs.dry_run &&
      inputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-edge-retry.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
